<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test du scan</title>
<style>
  body { margin:0; padding:16px; background:#0B0D12; color:#F4F6FA; font-family:system-ui,sans-serif; font-size:16px; }
  h1 { font-size:24px; margin:0 0 12px; }
  button { min-height:56px; width:100%; border:0; border-radius:16px; background:#C6FF3D; color:#0B0D12; font-size:18px; font-weight:700; }
  video { width:100%; margin-top:12px; border-radius:16px; background:#000; }
  pre { white-space:pre-wrap; background:rgba(255,255,255,.06); padding:12px; border-radius:12px; font-size:14px; }
  #verdict { font-size:22px; font-weight:700; margin:12px 0; }
</style>
</head>
<body>
<h1>Test du scan (story 1.5)</h1>
<p>À ouvrir dans Chrome. Appuie sur « Démarrer », autorise la caméra, présente un code-barres de produit.</p>
<button id="go">Démarrer la caméra</button>
<video id="v" playsinline muted></video>
<div id="verdict">Résultat : en attente</div>
<pre id="out"></pre>
<script>
const out = document.getElementById('out'), verdict = document.getElementById('verdict'), v = document.getElementById('v');
const log = (m) => { out.textContent += m + '\n'; };
const natif = 'BarcodeDetector' in window;
log('BarcodeDetector présent : ' + natif);
if (natif && BarcodeDetector.getSupportedFormats) {
  BarcodeDetector.getSupportedFormats().then((f) => log('Formats gérés : ' + f.join(', '))).catch((e) => log('getSupportedFormats : ' + e));
}
if (!natif) verdict.textContent = 'Résultat : natif ABSENT (bibliothèque à prévoir en 6.3)';
document.getElementById('go').onclick = async () => {
  try {
    const flux = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    v.srcObject = flux; await v.play(); log('Caméra ouverte.');
  } catch (e) { log('Caméra : ' + e.name + ' ' + e.message); verdict.textContent = 'Résultat : caméra inaccessible'; return; }
  if (!natif) return;
  const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'] });
  const t = setInterval(async () => {
    try {
      const codes = await det.detect(v);
      if (codes.length) {
        clearInterval(t);
        verdict.textContent = 'Résultat : natif OK';
        log('Code lu : ' + codes[0].rawValue + ' (' + codes[0].format + ')');
      }
    } catch (e) { clearInterval(t); log('detect : ' + e.name + ' ' + e.message); verdict.textContent = 'Résultat : natif en ERREUR'; }
  }, 250);
};
</script>
</body>
</html>
