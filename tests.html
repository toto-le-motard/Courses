<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tests du domaine</title>

h1 { font-size:20px; margin:0 0 8px; } #bilan { font-size:18px; font-weight:700; margin-bottom:12px; }
#bilan.ok,.ok { color:#C6FF3D; } #bilan.ko,.ko { color:#FF6B5E; } ul { list-style:none; padding:0; margin:0; }

<body><h1>Tests du domaine</h1><div id="bilan">…</div><ul id="liste"></ul>
<script type="module">
import { MAGASIN, VERDICT, UNITES, LIBELLE_UNITE, normaliserNom, nomTypeValide, unitesCompatibles, estCompatible, versUniteDeBase, convertir, verifierFormat, arrondirCentimes, analyserPrixSaisie, formaterPrixEuros, formaterPrixNormalise, prixNormalise, joursEntre, mediane, referenceLeclerc, habituelIntermarche, prixHabituel, prixHabituelAutreMagasin, calculerVerdict, estPrixIncoherent, decisionDoublon, analyserDoublon, cleDoublon, formatAffichage, trierReleves } from './domain.js';
const resultats={reussis:0,echecs:0,details:[]},lignes=[]; function test(exigence,nom,fn){let msg=null;try{fn()}catch(e){msg=e.message}if(msg){resultats.echecs++;resultats.details.push(exigence+' '+nom+' : '+msg)}else resultats.reussis++;lignes.push({ok:!msg,exigence,nom,msg});}
function egal(a,b,msg=''){if(JSON.stringify(a)!==JSON.stringify(b))throw new Error(msg+' attendu '+JSON.stringify(b)+', obtenu '+JSON.stringify(a));}
function proche(a,b,eps=1e-6){if(typeof a!=='number'||Math.abs(a-b)>eps)throw new Error('attendu ≈ '+b+', obtenu '+a);}
const LE=MAGASIN.LECLERC, IM=MAGASIN.INTERMARCHE, AUJ='2026-10-04';
test('UX 5 / story 3.6','prix incohérent sans relevé antérieur',()=>egal(estPrixIncoherent(100, null),false));
test('UX 5 / story 3.6','écart exactement 50% sans alerte',()=>{egal(estPrixIncoherent(150,100),false);egal(estPrixIncoherent(50,100),false);});
test('UX 5 / story 3.6','écart 50,01% avec alerte',()=>egal(estPrixIncoherent(150.01,100),true));
test('UX 5 / story 3.6','baisse et hausse',()=>{egal(estPrixIncoherent(49,100),true);egal(estPrixIncoherent(149,100),false);egal(estPrixIncoherent(151,100),true);});
test('FR8, FR9','tri historique par date puis id',()=>{const r=trierReleves([{id:2,date:'2026-10-01'},{id:5,date:'2026-10-02'},{id:4,date:'2026-10-02'}]);egal(r.map(x=>x.id),[5,4,2]);});
test('FR8, FR9','référence Leclerc recalculée après suppression',()=>{const a=[{magasin:LE,date:'2026-09-01',prixCentimes:700,formatBase:1000},{magasin:LE,date:'2026-09-08',prixCentimes:900,formatBase:1000},{magasin:LE,date:'2026-09-15',prixCentimes:800,formatBase:1000}];egal(referenceLeclerc(a,'kg',AUJ).valeur,800);egal(referenceLeclerc(a.slice(1),'kg',AUJ).ok,false);});
test('FR8, FR9','médiane recalculée après modification du prix',()=>{const a=[{magasin:LE,date:'2026-09-01',prixCentimes:700,formatBase:1000},{magasin:LE,date:'2026-09-08',prixCentimes:900,formatBase:1000},{magasin:LE,date:'2026-09-15',prixCentimes:1100,formatBase:1000}];egal(referenceLeclerc(a,'kg',AUJ).valeur,900);a[1].prixCentimes=1000;egal(referenceLeclerc(a,'kg',AUJ).valeur,1000);});
test('FR8, FR9','relevé passé en promo exclu de la référence',()=>{const a=[{magasin:LE,date:'2026-09-01',prixCentimes:700,formatBase:1000},{magasin:LE,date:'2026-09-08',prixCentimes:900,formatBase:1000},{magasin:LE,date:'2026-09-15',prixCentimes:800,formatBase:1000},{magasin:LE,date:'2026-09-20',prixCentimes:100,formatBase:1000,promo:true}];egal(referenceLeclerc(a,'kg',AUJ).valeur,800);});
test('UX 5 / story 3.6','doublon absent',()=>egal(decisionDoublon(null,100),'ajouter'));
test('UX 5 / story 3.6','clés promo et hors promo différentes',()=>{const a=cleDoublon({type:1,magasin:LE,date:AUJ,promo:0}),b=cleDoublon({type:1,magasin:LE,date:AUJ,promo:1});if(JSON.stringify(a)===JSON.stringify(b))throw new Error('clés identiques');});
test('UX 5 / story 3.6','promo true et 1 même clé',()=>egal(cleDoublon({type:1,magasin:LE,date:AUJ,promo:true}),cleDoublon({type:1,magasin:LE,date:AUJ,promo:1})));
test('UX 5 / story 3.6','types différents clés différentes',()=>{const a=cleDoublon({type:1,magasin:LE,date:AUJ,promo:0}),b=cleDoublon({type:2,magasin:LE,date:AUJ,promo:0});if(JSON.stringify(a)===JSON.stringify(b))throw new Error('clés identiques');});
test('UX 5 / story 3.6','magasins différents clés différentes',()=>{const a=cleDoublon({type:1,magasin:LE,date:AUJ,promo:0}),b=cleDoublon({type:1,magasin:IM,date:AUJ,promo:0});if(JSON.stringify(a)===JSON.stringify(b))throw new Error('clés identiques');});
test('UX 5 / story 3.6','dates différentes clés différentes',()=>{const a=cleDoublon({type:1,magasin:LE,date:AUJ,promo:0}),b=cleDoublon({type:1,magasin:LE,date:'2026-10-05',promo:0});if(JSON.stringify(a)===JSON.stringify(b))throw new Error('clés identiques');});
test('UX 5 / story 3.6','promo plus bas remplace',()=>egal(analyserDoublon({prixCentimes:900,format:1000,promo:true},{prixCentimes:600,format:1000,promo:true},'kg').decision,'remplacer'));
test('UX 5 / story 3.6','hors promo plus haut conserve',()=>egal(analyserDoublon({prixCentimes:900,format:1000,promo:false},{prixCentimes:950,format:1000,promo:false},'kg').decision,'conserver'));
test('UX 5 / story 3.6','existant absent ajoute',()=>egal(analyserDoublon(null,{prixCentimes:600,format:1000,promo:true},'kg').decision,'ajouter'));
test('UX 5 / story 3.6','formats différents comparés en prix normalisé',()=>{const r=analyserDoublon({prixCentimes:450,format:500},{prixCentimes:800,format:1000},'kg');egal(r.nExistant,900);egal(r.nNouveau,800);egal(r.decision,'remplacer');});

test('UX 5 / story 3.6','doublon égal',()=>egal(decisionDoublon(100,100),'remplacer'));
test('UX 5 / story 3.6','doublon plus bas',()=>egal(decisionDoublon(100,90),'remplacer'));
test('UX 5 / story 3.6','doublon plus haut',()=>egal(decisionDoublon(100,110),'conserver'));
const obs=(magasin,date,prixCentimes,formatBase=1000,promo=false)=>({magasin,date,prixCentimes,formatBase,promo});
test('FR1','normalisation du nom',()=>{egal(normaliserNom('CAFÉ Moulu'),'cafe moulu');egal(normaliserNom('  café   moulu '),'cafe moulu');});
test('FR1','nom valide',()=>{egal(nomTypeValide('Café'),true);egal(nomTypeValide('   '),false);egal(nomTypeValide('a'.repeat(60)),true);egal(nomTypeValide('a'.repeat(61)),false);});
test('FR1','unités historiques',()=>egal(UNITES.join(','),'kg,l,unit'));
test('FR5','conversions',()=>{egal(versUniteDeBase(500,'g'),500);egal(versUniteDeBase(.5,'kg'),500);egal(versUniteDeBase(1.5,'l'),1500);egal(versUniteDeBase(6,'unit'),6);egal(convertir(500,'g','kg'),.5);egal(convertir(750,'ml','l'),.75);});
test('FR5','compatibilité et format',()=>{egal(unitesCompatibles('kg'),['g','kg']);egal(estCompatible('kg','g'),true);egal(estCompatible('kg','l'),false);egal(verifierFormat('kg',500,'g'),{ok:true,formatBase:500});});
test('FR5','prix normalisé',()=>{egal(prixNormalise(399,500,'kg'),{ok:true,centimesParUnite:798});egal(prixNormalise(250,500,'l'),{ok:true,centimesParUnite:500});});
test('FR5','arrondi et saisie prix',()=>{egal(arrondirCentimes(0.5),1);egal(arrondirCentimes(-.5),-1);egal(analyserPrixSaisie('7,98'),798);egal(analyserPrixSaisie('7.98'),798);egal(analyserPrixSaisie('7,999'),800);egal(analyserPrixSaisie('0'),null);egal(formaterPrixEuros(798),'7,98 €');egal(formaterPrixNormalise(798,'kg'),'7,98 €/kg');});
test('FR10','dates et médiane',()=>{egal(joursEntre('2026-08-09',AUJ),56);egal(joursEntre('2026-10-05',AUJ),-1);egal(Number.isNaN(joursEntre('2026-02-30','2026-03-01')),true);egal(mediane([700,900,720]),720);egal(mediane([700,720,740,760]),730);});
test('FR10','référence Leclerc',()=>{const o=[obs(LE,'2026-09-06',700),obs(LE,'2026-09-13',900),obs(LE,'2026-09-20',720),obs(LE,'2026-09-21',400,1000,true)];const r=referenceLeclerc(o,'kg',AUJ);egal(r.ok,true);egal(r.valeur,720);egal(r.nbReleves,3);});
test('FR11','habituel Intermarché',()=>{egal(habituelIntermarche([obs(IM,'2026-07-10',700),obs(IM,'2026-09-12',720),obs(IM,'2026-09-12',500,1000,true)],'kg'),{ok:true,magasin:IM,type:'dernier',valeur:720,date:'2026-09-12'});});
test('FR6','hors promo issu d’une promo Leclerc',()=>{const o=[obs(LE,'2026-09-01',600,1000,true),obs(LE,'2026-09-01',800,1000,false),obs(LE,'2026-09-10',900),obs(LE,'2026-09-20',700),obs(IM,'2026-09-12',1000)];const r=referenceLeclerc(o,'kg',AUJ);egal(r.ok,true);egal(r.valeur,800);});
test('FR6','hors promo issu d’une promo Intermarché',()=>{const o=[obs(IM,'2026-09-12',900,1000,true),obs(IM,'2026-09-12',1100,1000,false)];const r=habituelIntermarche(o,'kg');egal(r.ok,true);egal(r.valeur,1100);});
test('FR14','verdict',()=>{const o=[obs(IM,'2026-09-12',1000)];const v=calculerVerdict({prixCentimes:950,formatBase:1000,typeUnit:'kg',magasin:LE,observations:o,aujourdhui:AUJ,seuilPct:5});egal(v.resultat,VERDICT.ACHETER_ICI);proche(v.ecart,-.05);});
test('FR14','seuil +5%',()=>{const v=calculerVerdict({prixCentimes:1050,formatBase:1000,typeUnit:'kg',magasin:LE,observations:[obs(IM,'2026-09-12',1000)],aujourdhui:AUJ,seuilPct:5});egal(v.resultat,VERDICT.ATTENDRE);});
test('FR15','différences',()=>{const v=calculerVerdict({prixCentimes:400,formatBase:500,typeUnit:'kg',magasin:LE,observations:[obs(IM,'2026-09-12',1000)],aujourdhui:AUJ,seuilPct:5});egal(v.differenceUniteCentimes,-200);egal(v.differenceFormatCentimes,-100);});
test('FR16','seuil réglable',()=>{const o=[obs(IM,'2026-09-12',1000)];egal(calculerVerdict({prixCentimes:950,formatBase:1000,typeUnit:'kg',magasin:LE,observations:o,aujourdhui:AUJ,seuilPct:10}).resultat,VERDICT.INDIFFERENT);});
test('FR18','données insuffisantes',()=>{const v=calculerVerdict({prixCentimes:800,formatBase:1000,typeUnit:'kg',magasin:LE,observations:[],aujourdhui:AUJ,seuilPct:5});egal(v.resultat,VERDICT.INSUFFISANT);});
const verdictLe=(prixCentimes,extra={})=>calculerVerdict({prixCentimes,formatBase:1000,typeUnit:'kg',magasin:LE,observations:[obs(IM,'2026-09-12',1000)],aujourdhui:AUJ,seuilPct:5,...extra});

test('FR5 / UX 3.1','formatAffichage : 1000 g = 1 kg',()=>egal(formatAffichage(1000,'kg'),{valeur:'1',unite:'kg'}));
test('FR5 / UX 3.1','formatAffichage : 1500 g = 1,5 kg',()=>egal(formatAffichage(1500,'kg'),{valeur:'1,5',unite:'kg'}));
test('FR5 / UX 3.1','formatAffichage : 250 ml',()=>egal(formatAffichage(250,'l'),{valeur:'250',unite:'ml'}));
test('FR5 / UX 3.1','formatAffichage : 2000 ml = 2 l',()=>egal(formatAffichage(2000,'l'),{valeur:'2',unite:'l'}));
test('FR5 / UX 3.1','formatAffichage : 6 unités',()=>egal(formatAffichage(6,'unit'),{valeur:'6',unite:'unit'}));
test('FR5 / UX 3.1','formatAffichage : aller-retour vers la base',()=>{for(const [base,type] of [[500,'kg'],[1000,'kg'],[1500,'kg'],[250,'l'],[2000,'l'],[6,'unit']]){const a=formatAffichage(base,type);egal(versUniteDeBase(Number(a.valeur.replace(',','.')),a.unite),base);}});
test('FR5 / UX 3.1','unitesCompatibles : kg = g et kg',()=>egal(unitesCompatibles('kg'),['g','kg']));
test('FR5 / UX 3.1','unitesCompatibles : l = ml et l',()=>egal(unitesCompatibles('l'),['ml','l']));
test('FR5 / UX 3.1','unitesCompatibles : unit = unité',()=>egal(unitesCompatibles('unit'),['unit']));
